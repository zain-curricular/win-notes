# Publishes site/ (the download page) to GitHub Pages. Needs Settings → Pages → Source: GitHub Actions, once.
# The page reads the newest release from the GitHub API, so it only needs deploying when site/ changes.
name: Deploy download page

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['site/**']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - run: cp build/icon.png site/icon.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
