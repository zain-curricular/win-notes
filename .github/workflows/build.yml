# Builds the Windows installer and the macOS app (a Mac app can only be built on macOS).
# Run it from the Actions tab ("Run workflow") or by pushing a tag like v0.1.1.
# Supabase URL and publishable key come from the committed .env.production.
name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Build
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: notes-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
