# Builds the Windows installer, the Mac app (only buildable on macOS), the Linux AppImage and .deb, and the Android
# APK, once the Checks pass. Run it from the Actions tab ("Run workflow") or by pushing a tag like v0.3.0.
# The release is a draft until it is published by hand, so the download page and the in-app update notice keep
# pointing at the previous release while the files are checked.
# Supabase URL and publishable key come from the committed .env.production. The APK is signed with the key in the
# ANDROID_* secrets (see README, "Android release key").
name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.draft.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A published release is never rewritten: its files may already be installed and checked against SHA256SUMS.
      - id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if draft=$(gh release view "$tag" --json isDraft -q .isDraft 2>/dev/null); then
            [ "$draft" = true ] || { echo "::error::$tag is already published. Bump the version to release again."; exit 1; }
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Notes $tag" --notes-file .github/release-notes.md --generate-notes
          fi

  desktop:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            # latest.yml and the blockmap are what installed copies read to update themselves.
            files: release/*.exe,release/*.exe.blockmap,release/latest.yml
          - os: macos-latest
            script: dist:mac
            files: release/*.dmg
          - os: ubuntu-latest
            script: dist:linux
            files: release/*.AppImage,release/*.deb,release/latest-linux.yml
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ matrix.files }}
      - name: Upload to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PATTERNS: ${{ matrix.files }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          shopt -s nullglob
          IFS=, read -ra globs <<< "$PATTERNS"
          # shellcheck disable=SC2206 # each pattern is a glob and must expand
          matched=(${globs[@]})
          [ ${#matched[@]} -gt 0 ] || { echo "::error::no files match $PATTERNS"; exit 1; }
          gh release upload "$TAG" "${matched[@]}" --clobber

  android:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      # ubuntu-latest ships with the Android SDK (ANDROID_HOME is set); Gradle fetches anything else it needs.
      - run: npm ci
      - run: npm ci
        working-directory: mobile
      - name: Release key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || { echo "::error::The ANDROID_KEYSTORE_BASE64 secret is not set."; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/notes-release.p12"
          echo "NOTES_KEYSTORE=$RUNNER_TEMP/notes-release.p12" >> "$GITHUB_ENV"
      - name: Build APK
        env:
          NOTES_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NOTES_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NOTES_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npm run dist:android | tee "$RUNNER_TEMP/android.log"
          grep 'Signing certificate SHA-256' "$RUNNER_TEMP/android.log" >> "$GITHUB_STEP_SUMMARY"
      - run: rm -f "$RUNNER_TEMP/notes-release.p12"
        if: always()
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.apk
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release.outputs.tag }}" release/*.apk --clobber

  checksums:
    needs: [release, desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --clobber
          cd dist && rm -f SHA256SUMS && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
