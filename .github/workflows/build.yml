# Builds the Windows installer and the macOS app (a Mac app can only be built on macOS).
# Run it from the Actions tab ("Run workflow") or by pushing a tag like v0.1.1.
# Supabase URL and publishable key come from the committed .env.production.
name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Build
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      # Installers go on the GitHub release for the package.json version (artifacts would use the account's
      # shared storage quota). Re-running replaces the files.
      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          tag="v$(node -p "require('./package.json').version")"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Notes $tag" --notes "Windows installer (.exe) and universal Mac app (.dmg). Unsigned: see the README for first-launch steps." || true
          files=(release/*.exe release/*.dmg)
          gh release upload "$tag" "${files[@]}" --clobber
