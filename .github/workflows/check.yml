# Typecheck and tests on every pushed branch; a pull request shows the run for its head commit.
# build.yml runs this before building installers. The tests set the platform themselves, so one Linux runner covers
# the Windows and Mac shortcut rules. Actions are pinned to commits; Dependabot keeps them current.
name: Checks

on:
  push:
    branches: ['**']
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - run: npm ci
      # The tests import Android code, and its tsconfig extends Expo's.
      - run: npm ci
        working-directory: mobile
      - run: npm run typecheck
      - run: npm run build:editor
      - run: npx tsc --noEmit
        working-directory: mobile
      - run: npm test
      # Only what ships inside the desktop app; build tools are kept current through Dependabot.
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e
      - if: runner.os != 'Linux'
        run: npm run test:e2e

  update:
    # A real install of this version updates itself in place to the next one, served from a local feed.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - name: Install this version
        shell: pwsh
        run: |
          Start-Process (Get-Item release\Notes-Setup-*.exe).FullName -ArgumentList '/S' -Wait
          Remove-Item release -Recurse
      - run: npm version patch --no-git-tag-version
      - run: npm run dist:win
      - name: Update the installed copy
        shell: pwsh
        run: |
          $env:NOTES_EXE = (Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter Notes.exe | Select-Object -First 1).FullName
          $env:NOTES_FEED_DIR = "$PWD\release"
          $env:NOTES_NEXT_VERSION = node -p "require('./package.json').version"
          node --test e2e/installed-update.mjs
