# Typecheck and tests on every pushed branch; a pull request shows the run for its head commit.
# Installers are built by build.yml. The tests set the platform themselves, so one Linux runner covers the
# Windows and Mac shortcut rules.
name: Checks

on:
  push:
    branches: ['**']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - run: npm ci
      # The tests import Android code, and its tsconfig extends Expo's.
      - run: npm ci
        working-directory: mobile
      - run: npm run typecheck
      - run: npm run build:editor
      - run: npx tsc --noEmit
        working-directory: mobile
      - run: npm test
